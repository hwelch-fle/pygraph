        network.on('doubleClick', (event) => {
            const node = data.nodes.get(event.nodes[0]);
            const edge = data.edges.get(event.edges[0]);
            if (node && node.link) { window.open(node.link); return; };
            if (edge && edge.link) { window.open(edge.link); return; };
        });

        nodeSelect = (name) => {
            return (selection) => {
                var nodes = data.nodes.getDataSet()
                var edges = data.edges.getDataSet()
                if (selection.length == 0) { network.setData({nodes: nodes, edges: edges}); return }
                edges = new vis.DataSet(
                    Array.from(
                        edges.get(
                            {
                                filter: (edge) => { 
                                    return selection.includes(edge.from) || selection.includes(edge.to) 
                                }
                            }
                        )
                    )
                )
                var connected = Array.from(edges.get({fields: ['from', 'to']}).map((e) => [e.from, e.to])).flat()
                nodes = new vis.DataSet(nodes.get({filter: (node) => { return connected.includes(node.id) }}))
                network.setData({nodes: nodes, edges: edges})
            }
        }

            return (selection) => {
                var nodes = data.nodes.getDataSet()
                var edges = data.edges.getDataSet()
                if (selection.length == 0) { network.setData({nodes: nodes, edges: edges}); return }
                var titles = Array.from(edges.get({fields: ['title'], filter: (e) => {return selection.includes(e.title)}})).flat()
                edges = new vis.DataSet(edges.get({filter: (edge) => {return selection.includes(edge.title)}}))

            }
