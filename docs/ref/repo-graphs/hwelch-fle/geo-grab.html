<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>geo-grab</title>
    <link
      href="https://fonts.googleapis.com/css?family=JetBrains Mono"
      rel="stylesheet"
    />

    <!-- FontAwesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Visjs-min -->
    <script
      type="text/javascript"
      src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"
    ></script>
    <style type="text/css">
      body {
        font-family: "JetBrains Mono";font-size: 12px;
      }
      #pygraph {
          width: 100%;
          height: 100%;
          border: 1px solid lightgray;
          background-color:#1f1f1f;
      }
    </style>
  </head>
  <body>
    
    <div id="pygraph"></div>

    <script type="text/javascript">
      
      const network = new vis.Network(
    document.getElementById('pygraph'),
    {
        nodes: new vis.DataSet([{"fixed": true, "group": "directory", "icon": {"code": "\uf07b", "color": "gold", "size": 100}, "id": ".", "label": "geo-grab", "level": 0, "link": "https://github.com/hwelch-fle/geo-grab", "title": "geo-grab", "x": 0, "y": 0}, {"group": "file", "id": ".gitignore", "label": ".gitignore", "level": 1, "link": "https://github.com/hwelch-fle/geo-grab/tree/master/.gitignore", "title": ".gitignore"}, {"group": "file", "id": ".python-version", "label": ".python-version", "level": 1, "link": "https://github.com/hwelch-fle/geo-grab/tree/master/.python-version", "title": ".python-version"}, {"group": ".py", "id": "geo_grab.py", "label": "geo_grab.py", "level": 1, "link": "https://github.com/hwelch-fle/geo-grab/tree/master/geo_grab.py", "title": "geo_grab.py"}, {"group": "file", "id": "LICENSE", "label": "LICENSE", "level": 1, "link": "https://github.com/hwelch-fle/geo-grab/tree/master/LICENSE", "title": "LICENSE"}, {"group": ".toml", "id": "pyproject.toml", "label": "pyproject.toml", "level": 1, "link": "https://github.com/hwelch-fle/geo-grab/tree/master/pyproject.toml", "title": "pyproject.toml"}, {"group": ".md", "id": "README.md", "label": "README.md", "level": 1, "link": "https://github.com/hwelch-fle/geo-grab/tree/master/README.md", "title": "README.md"}, {"group": ".png", "id": "usage.png", "label": "usage.png", "level": 1, "link": "https://github.com/hwelch-fle/geo-grab/tree/master/usage.png", "title": "usage.png"}, {"group": ".lock", "id": "uv.lock", "label": "uv.lock", "level": 1, "link": "https://github.com/hwelch-fle/geo-grab/tree/master/uv.lock", "title": "uv.lock"}]), 
        edges: new vis.DataSet([{"from": ".", "to": ".gitignore"}, {"from": ".", "to": ".python-version"}, {"from": ".", "to": "geo_grab.py"}, {"from": ".", "to": "LICENSE"}, {"from": ".", "to": "pyproject.toml"}, {"from": ".", "to": "README.md"}, {"from": ".", "to": "usage.png"}, {"from": ".", "to": "uv.lock"}]),
    }, 
    {"autoResize": true, "clickToUse": false, "configure": {"filter": false}, "edges": {"arrowStrikethrough": true, "arrows": "to", "color": {"hover": "gold", "inherit": "to"}, "endPointOffset": {"to": -5}, "hoverWidth": 5, "length": 50, "width": 3}, "groups": {".lock": {"icon": {"code": "\uf023", "color": "red"}, "shape": "icon"}, ".md": {"icon": {"code": "\uf60f", "color": "black"}, "shape": "icon"}, ".png": {"icon": {"code": "\uf03e", "color": "#6446d8"}, "shape": "icon"}, ".py": {"icon": {"code": "\uf3e2", "color": "#ffc42d"}, "shape": "icon"}, ".toml": {"icon": {"code": "\uf1c9", "color": "#86431a"}, "shape": "icon"}, "directory": {"icon": {"code": "\uf07b"}, "shape": "icon"}, "file": {"icon": {"code": "\uf1c9"}, "shape": "icon"}, "useDefaultGroups": false}, "height": "100%", "interaction": {"hoverConnectedEdges": true, "keyboard": {"enabled": true}, "navigationButtons": true, "selectConnectedEdges": true}, "layout": {"clusterThreshold": 150, "hierarchical": {"blockShifting": true, "direction": "UD", "edgeMinimization": true, "enabled": false, "levelSeparation": 150, "nodeSpacing": 100, "parentCentralization": true, "sortMethod": "hubsize", "treeSpacing": 200}, "improvedLayout": true}, "locale": "en", "locales": {}, "manipulation": {"addEdge": true, "addNode": true, "controlNodeStyle": {"borderWidth": 2, "borderWidthSelected": 2, "color": {"background": "#ff0000", "border": "#3c3c3c", "highlight": {"background": "#07f968", "border": "#3c3c3c"}}, "shape": "dot", "size": 6}, "deleteEdge": true, "deleteNode": true, "editEdge": true, "enabled": false, "initiallyActive": true}, "nodes": {"font": {"color": "#ffffff", "face": "JetBrains Mono", "size": 20, "strokeColor": "#404040", "strokeWidth": 3}, "shadow": {"color": "#454545", "size": 3, "x": 1, "y": 1}}, "physics": {"barnesHut": {"avoidOverlap": 0.5, "centralGravity": 0.1, "damping": 0.05, "gravitationalConstant": -15000}, "maxVelocity": 50, "solver": "barnesHut"}, "width": "100%"}
);


network.on('doubleClick', function (event) {
    const node = network.body.data.nodes.get(event.nodes[0]);
    if (node) { window.open(node.link) };
});


      
    </script>
  </body>
</html>
