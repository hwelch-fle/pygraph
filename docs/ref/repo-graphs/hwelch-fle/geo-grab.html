      // Node Transformers
let allNodes = () => network.body.data.nodes
let getNodes = (nodeIds) => allNodes().get(nodeIds)
let updateNodes = (nodeArray) => allNodes().updateOnly(nodeArray)

// Edge Transformers
let allEdges = () => network.body.data.edges
let getEdges = (edgeIds) => allEdges().get(edgeIds)
let edgesAtNode = (nodeId) => allEdges().get(network.getConnectedEdges(nodeId))
let nodesAtEdge = (edge) => [edge.to, edge.from]
let updateEdges = (edgeArray) => allEdges().updateOnly(edgeArray)

// Network Transformers
let setNetwork = (nodes, edges) => network.setData({ nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) })
let getBaseData = () => ({ nodes: data.nodes, edges: data.edges })
let resetNetwork = () => setNetwork(data.nodes.get(), data.edges.get())



let openLink = (item) => (item?.link) && window.open(item?.link) || false
let resolveLink = (event) => getNodes(event.nodes[0]) || getEdges(event.edges[0]) || undefined
      const data = {
    nodes:  new vis.DataSet([{"fixed": true, "group": "directory", "icon": {"code": "\uf07b", "color": "gold", "size": 100}, "id": ".", "label": "geo-grab", "level": 0, "link": "https://github.com/hwelch-fle/geo-grab", "title": "geo-grab", "x": 0, "y": 3}, {"group": "file", "id": ".gitignore", "label": ".gitignore", "level": 1, "link": "https://github.com/hwelch-fle/geo-grab/tree/master/.gitignore", "title": ".gitignore", "x": 429, "y": -911}, {"group": "file", "id": ".python-version", "label": ".python-version", "level": 1, "link": "https://github.com/hwelch-fle/geo-grab/tree/master/.python-version", "title": ".python-version", "x": 940, "y": 425}, {"group": ".py", "id": "geo_grab.py", "label": "geo_grab.py", "level": 1, "link": "https://github.com/hwelch-fle/geo-grab/tree/master/geo_grab.py", "title": "geo_grab.py", "x": -421, "y": -1000}, {"group": "file", "id": "LICENSE", "label": "LICENSE", "level": 1, "link": "https://github.com/hwelch-fle/geo-grab/tree/master/LICENSE", "title": "LICENSE", "x": -949, "y": -392}, {"group": ".toml", "id": "pyproject.toml", "label": "pyproject.toml", "level": 1, "link": "https://github.com/hwelch-fle/geo-grab/tree/master/pyproject.toml", "title": "pyproject.toml", "x": -372, "y": 962}, {"group": ".md", "id": "README.md", "label": "README.md", "level": 1, "link": "https://github.com/hwelch-fle/geo-grab/tree/master/README.md", "title": "README.md", "x": -962, "y": 378}, {"group": ".png", "id": "usage.png", "label": "usage.png", "level": 1, "link": "https://github.com/hwelch-fle/geo-grab/tree/master/usage.png", "title": "usage.png", "x": 954, "y": -403}, {"group": ".lock", "id": "uv.lock", "label": "uv.lock", "level": 1, "link": "https://github.com/hwelch-fle/geo-grab/tree/master/uv.lock", "title": "uv.lock", "x": 380, "y": 936}]),
    edges: new vis.DataSet([{"from": ".", "to": ".gitignore"}, {"from": ".", "to": ".python-version"}, {"from": ".", "to": "geo_grab.py"}, {"from": ".", "to": "LICENSE"}, {"from": ".", "to": "pyproject.toml"}, {"from": ".", "to": "README.md"}, {"from": ".", "to": "usage.png"}, {"from": ".", "to": "uv.lock"}]),

const network = new vis.Network(document.getElementById('pygraph'), data, options);
      
      network.on('hoverEdge', (event) => { updateEdges(getEdges([event.edge]).map(showLabel)) });
network.on('blurEdge', (event) => { updateEdges(getEdges([event.edge]).map(hideLabel)) });
network.on('hoverNode', (event) => { updateEdges(edgesAtNode(event.node).map(showLabel)) });
network.on('blurNode', (event) => { updateEdges(edgesAtNode(event.node).map(hideLabel)) });
      
      
      // Progress Bar
const progressContainer = document.getElementById('progressContainer')
const progressBar = document.getElementById('progressBar')

let setProgressBar = (visibility, percent) => {
    progressContainer.style.visibility = visibility
    progressBar.style.width = `${percent}%`
};
let hideProgressBar = () => setProgressBar('hidden', 0);
let showProgressBar = (percent) => setProgressBar('visible', percent);

network.on('stabilizationProgress', (event) => {showProgressBar((event.iterations / event.total) * 100)});
network.on('stabilizationIterationsDone', hideProgressBar);
network.on('stabilized', hideProgressBar);
      
      
      





let changeNodes = (selection) => {
    if (selection.length == 0) { resetNetwork(); return; }
    
    var { nodes, edges } = getBaseData()
    edges = edges.get({
        filter: (edge) =>
        selection.includes(edge.to) || selection.includes(edge.from),
    })
    const nodeIds = [
        ...new Set(edges.map((edge) => [edge.to, edge.from]).flat()),
    ]
    nodes = nodes.get(nodeIds)
    setNetwork(nodes, edges)
};




const collator = new Intl.Collator(undefined, {
  numeric: true,
  sensitivity: "base",
});


const tomSelectNodes = new TomSelect("#tom-select-nodes", {
  maxItems: null,
  maxOptions: 100,
  valueField: "id",
  labelField: "id",
  searchField: "id",
  sortField: "label",
  options: allNodes()
    
    .get(),
    
  create: false,
  onChange: changeNodes,
  
  onClear: resetNetwork,
  
  plugins: ['remove_button', 'clear_button', 'input_autogrow'],
});




// Selection Transformers
let addItem = (selector, item) => item ? selector.addItem(item, false) || true : false
let addNodeSelection = (item) => addItem(tomSelectNodes, item?.id)
let addEdgeSelection = (item) =>  undefined 
let updateSelection = (event) => addNodeSelection(getNodes(event.nodes[0])) || addEdgeSelection(getEdges(event.edges[0]))
let clearFilters = () => {
  
  tomSelectNodes.clear(false);
}
      
      
      network.on("doubleClick", (event) => {
  openLink(resolveLink(event))
  
  || clearFilters();
  
});

var clickStack = [];
network.on("click", async (event) => {
  const clickedAt = new Date().valueOf();
  clickStack.push(clickedAt);
  await new Promise((r) => setTimeout(r, 200));
  if (clickStack.pop() == clickedAt) {
    
    updateSelection(event);
    
  }
});
