const progressContainer = document.getElementById('progressContainer')
const progressBar = document.getElementById('progressBar')

let setProgressBar = (visibility, percent) => {
    progressContainer.style.visibility = visibility
    progressBar.style.width = `${percent}%`
};
let hideProgressBar = () => setProgressBar('hidden', 0);
let showProgressBar = (percent) => setProgressBar('visible', percent);

network.on('stabilizationProgress', (event) => {showProgressBar((event.iterations / event.total) * 100)});
network.on('stabilizationIterationsDone', hideProgressBar);
network.on('stabilized', hideProgressBar);
      
      
      





let changeNodes = (selection) => {
    if (selection.length == 0) { resetNetwork(); return; }
    
    var { nodes, edges } = getBaseData()
    edges = edges.get({
        filter: (edge) =>
        selection.includes(edge.to) || selection.includes(edge.from),
    })
    const nodeIds = [
        ...new Set(edges.map((edge) => [edge.to, edge.from]).flat()),
    ]
    nodes = nodes.get(nodeIds)
    setNetwork(nodes, edges)
};

let addEdgeSelection = (item) =>  undefined

var clickStack = [];
network.on("click", async (event) => {
  const clickedAt = new Date().valueOf();
  clickStack.push(clickedAt);
  await new Promise((r) => setTimeout(r, 200));
  if (clickStack.pop() == clickedAt) {
    
    updateSelection(event);
    
  }
});
