            options: Array.from(network.body.data.nodes.get()),
            create: false,
            onChange: nodeSelect('onChange'),
            onClear: network.setData({ nodes: data.nodes, edges: data.edges }),

        tomSelectEdges = new TomSelect('#tom-select-edges', {
            maxItems: null,

            valueField: 'title',
