

<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pygraph</title>
    <!-- JetBrains Mono -->
    <link
      href="https://fonts.googleapis.com/css?family=JetBrains Mono"
      rel="stylesheet"
    />

    <!-- Material Symbols -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />

    <!-- FontAwesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Visjs-min -->
    <script
      type="text/javascript"
      src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"
    ></script>
    <style type="text/css">
      body {
        font-family: 'JetBrains Mono';font-size: 12px;
      }
      #pygraph {
          width: 100%;
          height: 100%;
          border: 1px solid lightgray;
          background-color:#1f1f1f;
      }
    </style>
  </head>
  <body>
    
    <div id="pygraph"></div>

    <script type="text/javascript">
      
      // ---------------- NETWORK START ----------------------
const data = create_network();

function create_network() {
    const container = document.getElementById('pygraph');
    const data = {
        nodes: new vis.DataSet([{"fixed": true, "group": "directory", "icon": {"code": "\uf07b", "color": "gold", "size": 100}, "id": ".", "label": "dev", "level": 0, "link": "https://github.com/hwelch-fle/pygraph/tree/master/dev", "title": "pygraph/dev", "x": 0, "y": 0}, {"group": ".py", "id": "build_graph.py", "label": "build_graph.py", "level": 1, "link": "https://github.com/hwelch-fle/pygraph/tree/master/dev/build_graph.py", "title": "build_graph.py"}]),
        edges: new vis.DataSet([{"from": ".", "to": "build_graph.py"}]),
    };
    const options = {"autoResize": true, "clickToUse": false, "configure": {"filter": false}, "edges": {"arrowStrikethrough": true, "arrows": "to", "color": {"hover": "gold", "inherit": "to"}, "endPointOffset": {"to": -5}, "hoverWidth": 5, "length": 50, "width": 3}, "groups": {".py": {"font": {"color": "white", "strokeWidth": 3}, "icon": {"code": "\uf3e2", "color": "yellow"}, "shape": "icon"}, "directory": {"icon": {"code": "\uf07b"}, "shape": "icon"}, "file": {"font": {"color": "white", "strokeWidth": 3}, "icon": {"code": "\uf1c9", "color": "#3572a5"}, "shape": "icon"}, "useDefaultGroups": false}, "height": "100%", "interaction": {"hoverConnectedEdges": true, "keyboard": {"enabled": true}, "navigationButtons": true, "selectConnectedEdges": true}, "layout": {"clusterThreshold": 150, "hierarchical": {"blockShifting": true, "direction": "UD", "edgeMinimization": true, "enabled": false, "levelSeparation": 150, "nodeSpacing": 100, "parentCentralization": true, "sortMethod": "hubsize", "treeSpacing": 200}, "improvedLayout": true}, "locale": "en", "locales": {}, "manipulation": {"addEdge": true, "addNode": true, "controlNodeStyle": {"borderWidth": 2, "borderWidthSelected": 2, "color": {"background": "#ff0000", "border": "#3c3c3c", "highlight": {"background": "#07f968", "border": "#3c3c3c"}}, "shape": "dot", "size": 6}, "deleteEdge": true, "deleteNode": true, "editEdge": true, "enabled": false, "initiallyActive": true}, "nodes": {"font": {"color": "#ffffff", "size": 20, "strokeColor": "#4e4e4e", "strokeWidth": 5}, "shadow": {"color": "#454545", "size": 3, "x": 1, "y": 1}}, "physics": {"barnesHut": {"avoidOverlap": 0.5, "centralGravity": 0.1, "gravitationalConstant": -15000}, "solver": "barnesHut"}, "width": "100%"};
    const pygraph = "";
    const network = new vis.Network(container, data, options)

    // Event Handlers
    network.on('doubleClick', function (event) {
        const { nodes } = event;
        if (nodes.length == 0) { return; }
        const nodeId = nodes[0];
        const nodeData = network.body.data.nodes.get(nodeId);
        if ( nodeData.link ) { window.open(nodeData.link); }
    });

    return {
        network: network,
        pygraph: pygraph,
    }
}

// ---------------- NETWORK END ----------------------
      
      
    </script>
  </body>
</html>
